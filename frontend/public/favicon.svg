<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="60%" stop-color="#0088ff"/>
      <stop offset="100%" stop-color="#003366"/>
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="50%" stop-color="#0066ff"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="#050505"/>
  <!-- Outer rotating hexagon -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="18s" repeatCount="indefinite"/>
    <polygon points="256,36 448,144 448,368 256,476 64,368 64,144" fill="none" stroke="url(#ringGrad)" stroke-width="3" opacity="0.7" filter="url(#glow)"/>
  </g>
  <!-- Inner rotating hexagon (counter) -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="360 256 256" to="0 256 256" dur="12s" repeatCount="indefinite"/>
    <polygon points="256,96 396,176 396,336 256,416 116,336 116,176" fill="none" stroke="#00ffff" stroke-width="1.5" opacity="0.35"/>
  </g>
  <!-- Pulsing core -->
  <circle cx="256" cy="256" r="70" fill="url(#coreGrad)" filter="url(#glow)">
    <animate attributeName="r" values="62;78;62" dur="2.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    <animate attributeName="opacity" values="0.85;1;0.85" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- Center bright dot -->
  <circle cx="256" cy="256" r="18" fill="#ffffff" opacity="0.95">
    <animate attributeName="r" values="14;22;14" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.6s" repeatCount="indefinite"/>
  </circle>
  <!-- Orbiting particles -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 256 256" to="360 256 256" dur="6s" repeatCount="indefinite"/>
    <circle cx="256" cy="130" r="6" fill="#00ffff" filter="url(#glow)"/>
    <circle cx="256" cy="382" r="6" fill="#00ffff" filter="url(#glow)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="120 256 256" to="480 256 256" dur="6s" repeatCount="indefinite"/>
    <circle cx="256" cy="130" r="4" fill="#0088ff" filter="url(#glow)"/>
    <circle cx="256" cy="382" r="4" fill="#0088ff" filter="url(#glow)"/>
  </g>
  <g>
    <animateTransform attributeName="transform" type="rotate" from="240 256 256" to="600 256 256" dur="6s" repeatCount="indefinite"/>
    <circle cx="256" cy="130" r="5" fill="#00ffff" filter="url(#glow)"/>
    <circle cx="256" cy="382" r="5" fill="#00ffff" filter="url(#glow)"/>
  </g>
</svg>